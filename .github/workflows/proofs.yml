name: Verify proofs
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      MATHLIB_NO_CACHE_ON_UPDATE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1
        with:
          auto-config: "false"
          build: "false"
          use-mathlib-cache: "false"
          use-github-cache: "false"
      - name: Fetch the mathlib modules used by the proofs
        run: |
          sed -n 's/^import \(Mathlib[.].*\)$/\1/p' Conjectures/*.lean | sort -u | xargs lake exe cache get
      - run: lake build
      - run: lake env lean Audit.lean
      - run: python3 scripts/verify_orbital_flow_roots.py
